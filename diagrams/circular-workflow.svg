<svg viewBox="0 0 840 900" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#171B26"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
    <marker id="arrowBrass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9A24B"/>
    </marker>
    <marker id="arrowBurg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4535F"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="840" height="900" fill="url(#bgGlow)"/>

  <text x="420" y="58" text-anchor="middle" fill="#E4C878" font-size="13" letter-spacing="4">EMERITUS &#183; K&#8211;12 ADAPTIVE MASTERY LEARNING OS</text>
  <text x="420" y="86" text-anchor="middle" fill="#F3EDDD" font-size="22" letter-spacing="3" font-weight="600">THE MASTERY LOOP</text>

  <!-- outer ring -->
  <circle cx="420" cy="480" r="300" fill="none" stroke="#2A2F3A" stroke-width="1.5"/>
  <circle cx="420" cy="480" r="300" fill="none" stroke="#C9A24B" stroke-width="2" stroke-dasharray="1 11" stroke-linecap="round"/>

  <!-- directional arc segments (clockwise) with arrowheads -->
  <path d="M 561.2 267.9 A 300 300 0 0 1 691.9 480" fill="none" stroke="#7C6430" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <path d="M 691.9 480 A 300 300 0 0 1 561.2 692.1" fill="none" stroke="#7C6430" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <path d="M 561.2 692.1 A 300 300 0 0 1 278.8 692.1" fill="none" stroke="#7C6430" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <path d="M 278.8 692.1 A 300 300 0 0 1 148.1 480" fill="none" stroke="#7C6430" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <path d="M 148.1 480 A 300 300 0 0 1 278.8 267.9" fill="none" stroke="#7C6430" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <path d="M 278.8 267.9 A 300 300 0 0 1 420 180" fill="none" stroke="#7C6430" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <path d="M 420 180 A 300 300 0 0 1 561.2 267.9" fill="none" stroke="#7C6430" stroke-width="2" marker-end="url(#arrowBrass)"/>

  <!-- remediation chord: ASSESS back to TEACH -->
  <path d="M 267.9 692.1 C 220 500, 320 320, 592.1 267.9" fill="none" stroke="#B4535F" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#arrowBurg)"/>
  <rect x="215" y="383" width="170" height="34" rx="4" fill="#0B0E14" stroke="#4A2A30" stroke-width="1"/>
  <text x="300" y="397" text-anchor="middle" fill="#C97783" font-size="9.5" letter-spacing="0.5">MISCONCEPTION</text>
  <text x="300" y="411" text-anchor="middle" fill="#C97783" font-size="9.5" letter-spacing="0.5">DETECTED &#8594; REMEDIATE</text>

  <!-- retention branch: RETAIN loops back to DIAGNOSE (review cadence note) -->
  <rect x="216" y="152" width="148" height="22" rx="4" fill="#0B0E14" stroke="#3A3220" stroke-width="1"/>
  <text x="290" y="167" text-anchor="middle" fill="#8E8878" font-size="9.5" letter-spacing="0.5">REVIEW DUE IN N DAYS</text>

  <!-- Node group template applied per node -->
  <!-- 1 DIAGNOSE -->
  <g filter="url(#soft)">
    <circle cx="420" cy="180" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2"/>
    <text x="420" y="172" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">01</text>
    <text x="420" y="192" text-anchor="middle" fill="#F3EDDD" font-size="13.5" font-weight="600" letter-spacing="0.5">DIAGNOSE</text>
  </g>

  <!-- 2 TEACH -->
  <g filter="url(#soft)">
    <circle cx="592.1" cy="267.9" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2"/>
    <text x="592.1" y="259.9" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">02</text>
    <text x="592.1" y="279.9" text-anchor="middle" fill="#F3EDDD" font-size="13.5" font-weight="600" letter-spacing="0.5">TEACH</text>
  </g>

  <!-- 3 SHOW & INTERACT -->
  <g filter="url(#soft)">
    <circle cx="680" cy="480" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2"/>
    <text x="680" y="466" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">03</text>
    <text x="680" y="483" text-anchor="middle" fill="#F3EDDD" font-size="12" font-weight="600" letter-spacing="0.5">SHOW &amp;</text>
    <text x="680" y="498" text-anchor="middle" fill="#F3EDDD" font-size="12" font-weight="600" letter-spacing="0.5">INTERACT</text>
  </g>

  <!-- 4 COMPREHEND -->
  <g filter="url(#soft)">
    <circle cx="592.1" cy="692.1" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2"/>
    <text x="592.1" y="684.1" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">04</text>
    <text x="592.1" y="703" text-anchor="middle" fill="#F3EDDD" font-size="12.5" font-weight="600" letter-spacing="0.5">COMPREHEND</text>
  </g>

  <!-- 5 PRACTICE & APPLY -->
  <g filter="url(#soft)">
    <circle cx="420" cy="780" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2"/>
    <text x="420" y="772" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">05</text>
    <text x="420" y="789" text-anchor="middle" fill="#F3EDDD" font-size="12" font-weight="600" letter-spacing="0.5">PRACTICE &amp;</text>
    <text x="420" y="804" text-anchor="middle" fill="#F3EDDD" font-size="12" font-weight="600" letter-spacing="0.5">APPLY</text>
  </g>

  <!-- 6 ASSESS -->
  <g filter="url(#soft)">
    <circle cx="247.9" cy="692.1" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2"/>
    <text x="247.9" y="684.1" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">06</text>
    <text x="247.9" y="703" text-anchor="middle" fill="#F3EDDD" font-size="13.5" font-weight="600" letter-spacing="0.5">ASSESS</text>
  </g>

  <!-- 7 MASTER -->
  <g filter="url(#soft)">
    <circle cx="160" cy="480" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2.5"/>
    <text x="160" y="472" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">07</text>
    <text x="160" y="491" text-anchor="middle" fill="#F3EDDD" font-size="13.5" font-weight="700" letter-spacing="0.5">MASTER</text>
  </g>

  <!-- 8 RETAIN -->
  <g filter="url(#soft)">
    <circle cx="247.9" cy="267.9" r="52" fill="#12161F" stroke="#C9A24B" stroke-width="2"/>
    <text x="247.9" y="259.9" text-anchor="middle" fill="#E4C878" font-size="10.5" letter-spacing="1">08</text>
    <text x="247.9" y="279.9" text-anchor="middle" fill="#F3EDDD" font-size="13.5" font-weight="600" letter-spacing="0.5">RETAIN</text>
  </g>

  <!-- center emblem -->
  <circle cx="420" cy="480" r="95" fill="#0B0E14" stroke="#3A3220" stroke-width="1"/>
  <circle cx="420" cy="480" r="86" fill="none" stroke="#C9A24B" stroke-width="1"/>
  <text x="420" y="466" text-anchor="middle" fill="#8E8878" font-size="10" letter-spacing="3">EVIDENCE</text>
  <text x="420" y="486" text-anchor="middle" fill="#E4C878" font-size="15" letter-spacing="1.5" font-weight="700">NOT</text>
  <text x="420" y="508" text-anchor="middle" fill="#E4C878" font-size="15" letter-spacing="1.5" font-weight="700">COMPLETION</text>

  <!-- caption -->
  <text x="420" y="855" text-anchor="middle" fill="#6E695E" font-size="12" letter-spacing="0.5">A concept is never marked mastered because it was viewed &#8212; only because it was demonstrated, retested, and retained.</text>
  <text x="420" y="878" text-anchor="middle" fill="#4A473F" font-size="10.5" letter-spacing="2">CONSTITUTIONAL INVARIANT &#183; SECTION 1</text>
</svg>
