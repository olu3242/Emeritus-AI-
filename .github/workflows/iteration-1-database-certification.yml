name: Iteration 1 database certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/curriculum/**"
      - "tests/integration/**"
      - "scripts/apply-test-migrations.ts"
      - ".github/workflows/iteration-1-database-certification.yml"

permissions:
  contents: read

jobs:
  postgres-certification:
    name: Clean PostgreSQL run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: emeritus_certification_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emeritus_certification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/emeritus_certification_test
      TEST_DATABASE_BOOTSTRAP: supabase-compatible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply clean migration set
        run: npm run db:test:migrate
      - name: Run PostgreSQL and RLS certification
        run: npm run test:integration
      - name: Run non-live regression
        run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
